<ion-item-sliding>
  <ion-item [class.completed]="task.completed" lines="none" class="task-item">
    <ion-checkbox
      slot="start"
      [checked]="task.completed"
      (ionChange)="toggleComplete.emit(task.id)"
      [style.--checkbox-background-checked]="category?.color || 'var(--ion-color-primary)'"
      [style.--border-color-checked]="category?.color || 'var(--ion-color-primary)'"
    ></ion-checkbox>

    <ion-label (click)="editTask.emit(task)">
      <h2 [class.strikethrough]="task.completed">{{ task.title }}</h2>
      <p *ngIf="task.description">{{ task.description }}</p>
      <div class="category-chip" *ngIf="category" [style.background]="category.color + '22'" [style.color]="category.color">
        <span class="dot" [style.background]="category.color"></span>
        {{ category.name }}
      </div>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="danger" (click)="deleteTask.emit(task.id)" expandable>
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
